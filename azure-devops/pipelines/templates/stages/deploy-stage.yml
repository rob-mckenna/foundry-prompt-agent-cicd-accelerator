# Deploys or promotes one immutable package to one environment.
#
# Approval control: the deployment job targets an Azure DevOps Environment. Approvals, business hours checks
# and branch control configured on that Environment gate the job before any step runs. This template contains
# no approval logic on purpose, so that the control lives where it can be audited.
#
# Authentication: the AzureCLI@2 task uses a workload identity federation service connection. No secret is
# passed on a command line, set as a pipeline variable or written to a log.

parameters:
  - name: stageName
    type: string
  - name: displayName
    type: string
  - name: dependsOn
    type: object
    default: []
  - name: condition
    type: string
    default: succeeded()
  - name: environmentName
    type: string
    values: [dev, test, uat, prod]
  - name: azureDevOpsEnvironment
    type: string
  - name: serviceConnection
    type: string
  - name: variableGroup
    type: string
  - name: agentName
    type: string
  - name: agentVersion
    type: string
  - name: operation
    type: string
    default: deploy
    values: [deploy, promote]
  - name: sourceEnvironment
    type: string
    default: ''
  - name: packageArtifactName
    type: string
    default: agentPackage
  - name: sourcePipelineResource
    type: string
    default: ''
  - name: runEvaluations
    type: boolean
    default: false
  - name: evaluationSuitePath
    type: string
    default: ''
  - name: runRegression
    type: boolean
    default: false
  - name: validateSecretReferences
    type: boolean
    default: false
  - name: rollbackOnFailure
    type: boolean
    default: true
  - name: changeRecordId
    type: string
    default: ''
  - name: businessSignoffId
    type: string
    default: ''
  - name: republishPackage
    type: boolean
    default: false

stages:
  - stage: ${{ parameters.stageName }}
    displayName: ${{ parameters.displayName }}
    dependsOn: ${{ parameters.dependsOn }}
    condition: ${{ parameters.condition }}
    lockBehavior: sequential
    variables:
      - group: ${{ parameters.variableGroup }}
    jobs:
      - deployment: deployAgent
        displayName: Deploy ${{ parameters.agentName }} to ${{ parameters.environmentName }}
        environment: ${{ parameters.azureDevOpsEnvironment }}
        timeoutInMinutes: 60
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: UsePythonVersion@0
                  displayName: Use Python 3.11
                  inputs:
                    versionSpec: '3.11'

                - task: PowerShell@2
                  displayName: Install pinned Foundry SDK dependencies
                  inputs:
                    pwsh: true
                    targetType: inline
                    workingDirectory: $(Build.SourcesDirectory)
                    script: |
                      Set-StrictMode -Version 3.0
                      $ErrorActionPreference = 'Stop'
                      python -m pip install --disable-pip-version-check -r scripts/python/requirements.txt

                - ${{ if eq(parameters.sourcePipelineResource, '') }}:
                    - download: current
                      artifact: ${{ parameters.packageArtifactName }}
                      displayName: Download immutable package
                - ${{ if ne(parameters.sourcePipelineResource, '') }}:
                    - download: ${{ parameters.sourcePipelineResource }}
                      artifact: ${{ parameters.packageArtifactName }}
                      displayName: Download promoted package from the source pipeline

                - ${{ if and(eq(parameters.operation, 'promote'), eq(parameters.sourcePipelineResource, '')) }}:
                    - download: current
                      artifact: releaseRecords-${{ parameters.sourceEnvironment }}
                      displayName: Download attested source release record
                - ${{ if and(eq(parameters.operation, 'promote'), ne(parameters.sourcePipelineResource, '')) }}:
                    - download: ${{ parameters.sourcePipelineResource }}
                      artifact: releaseRecords-${{ parameters.sourceEnvironment }}
                      displayName: Download attested source release record

                - task: PowerShell@2
                  name: locatePackage
                  displayName: Verify package before deployment
                  inputs:
                    pwsh: true
                    targetType: inline
                    workingDirectory: $(Build.SourcesDirectory)
                    script: |
                      Set-StrictMode -Version 3.0
                      $ErrorActionPreference = 'Stop'
                      $root = '$(Pipeline.Workspace)'
                      $package = Get-ChildItem $root -Recurse -Filter '*.zip' -File |
                        Where-Object { $_.Directory.Name -eq '${{ parameters.packageArtifactName }}' -or $_.FullName -like "*${{ parameters.packageArtifactName }}*" } |
                        Select-Object -First 1
                      if (-not $package) { throw "No package artifact named '${{ parameters.packageArtifactName }}' was downloaded to $root." }

                      $result = ./scripts/Test-AgentPackage.ps1 -PackagePath $package.FullName -Environment ${{ parameters.environmentName }} -SkipGovernance
                      # import-agent enforces runtime governance with approved change metadata before mutation.
                      if ($result.AgentName -ne '${{ parameters.agentName }}') {
                        throw "Artifact holds agent '$($result.AgentName)' but '${{ parameters.agentName }}' was requested."
                      }
                      Write-Host "##vso[task.setvariable variable=packagePath]$($package.FullName)"
                      Write-Host "##vso[task.setvariable variable=packageId]$($result.PackageId)"
                      if ('${{ parameters.operation }}' -eq 'promote') {
                        $sourceEvidence = @(Get-ChildItem $root -Recurse -File -Filter 'deployment-evidence.json' | ForEach-Object {
                          $document = Get-Content $_.FullName -Raw | ConvertFrom-Json
                          if ($document.environment -eq '${{ parameters.sourceEnvironment }}' -and
                              $document.agentName -ceq '${{ parameters.agentName }}') { $document }
                        })
                        if ($sourceEvidence.Count -ne 1 -or $sourceEvidence[0].mutationCompleted -ne $true) {
                          throw 'Expected one completed exact source deployment context in the handoff.'
                        }
                        $sourceRecords = @(Get-ChildItem $root -Recurse -File -Filter "$($sourceEvidence[0].releaseId).json")
                        if ($sourceRecords.Count -ne 1) { throw 'The exact source attempt record is absent or ambiguous.' }
                        $sourceRecord = $sourceRecords[0]
                        Write-Host "##vso[task.setvariable variable=sourceReleaseRecordPath]$($sourceRecord.FullName)"
                      }

                - task: AzureCLI@2
                  name: deployOrPromote
                  displayName: Deploy or promote
                  inputs:
                    azureSubscription: ${{ parameters.serviceConnection }}
                    scriptType: pscore
                    scriptLocation: inlineScript
                    workingDirectory: $(Build.SourcesDirectory)
                    inlineScript: |
                      Set-StrictMode -Version 3.0
                      $ErrorActionPreference = 'Stop'

                      # Supplied by the variable group. These are identifiers, not secrets.
                      $env:AZURE_SUBSCRIPTION_ID = '$(azureSubscriptionId)'
                      $env:AZURE_TENANT_ID = '$(azureTenantId)'
                      $env:CHANGE_RECORD_ID = '${{ parameters.changeRecordId }}'

                      $gates = @{ validation = 'passed' }
                      $evidencePath = '$(Build.ArtifactStagingDirectory)/releases/deployment-evidence.json'
                      $result = $null
                      try {
                        if ('${{ parameters.operation }}' -eq 'promote') {
                          $commandOutput = @(./scripts/promote-agent.ps1 `
                            -AgentName '${{ parameters.agentName }}' `
                            -FromEnvironment '${{ parameters.sourceEnvironment }}' `
                            -ToEnvironment '${{ parameters.environmentName }}' `
                            -PackagePath '$(packagePath)' `
                            -SourceReleaseRecordPath '$(sourceReleaseRecordPath)' `
                            -ReleaseDirectory '$(Build.ArtifactStagingDirectory)/releases' `
                            -DeploymentEvidencePath $evidencePath `
                            -ChangeRecordId '${{ parameters.changeRecordId }}' `
                            -BusinessSignoffId '${{ parameters.businessSignoffId }}' `
                            -GateResult $gates)
                        }
                        else {
                          $parameters = @{
                            PackagePath            = '$(packagePath)'
                            Environment            = '${{ parameters.environmentName }}'
                            Operation              = 'deploy'
                            ReleaseDirectory       = '$(Build.ArtifactStagingDirectory)/releases'
                            DeploymentEvidencePath = $evidencePath
                            GateResult             = $gates
                          }
                          if ('${{ parameters.changeRecordId }}') { $parameters['ChangeRecordId'] = '${{ parameters.changeRecordId }}' }
                          if ('${{ parameters.businessSignoffId }}') { $parameters['BusinessSignoffId'] = '${{ parameters.businessSignoffId }}' }
                          if ('${{ parameters.validateSecretReferences }}' -ieq 'true') { $parameters['ValidateSecretReferences'] = $true }
                          $commandOutput = @(./scripts/import-agent.ps1 @parameters)
                        }

                        $commandOutput | Write-Output
                        $result = @($commandOutput | Where-Object {
                            $_.PSObject.Properties.Name -contains 'ReleaseRecord'
                          }) | Select-Object -Last 1
                        if (-not $result) {
                          throw 'Deployment completed without returning the deployment result contract.'
                        }
                        Write-Host '##vso[task.setvariable variable=deploymentCommandSucceeded]true'
                      }
                      finally {
                        if (Test-Path -LiteralPath $evidencePath) {
                          $evidence = Get-Content -LiteralPath $evidencePath -Raw | ConvertFrom-Json
                          Write-Host "##vso[task.setvariable variable=releaseRecordPath]$($evidence.releaseRecordPath)"
                          Write-Host "##vso[task.setvariable variable=rollbackArtifactPath]$($evidence.rollbackArtifactPath)"
                          Write-Host "##vso[task.setvariable variable=deploymentChanged]$(([string]$evidence.mutationStarted).ToLowerInvariant())"
                          Write-Host "##vso[task.setvariable variable=mutationCompleted]$(([string]$evidence.mutationCompleted).ToLowerInvariant())"
                          Write-Host "##vso[task.setvariable variable=priorArtifactStaged]$(([string]$evidence.priorArtifactStaged).ToLowerInvariant())"
                          Write-Host "##vso[task.setvariable variable=failureEvidencePath]$evidencePath"
                        }
                      }

                - task: AzureCLI@2
                  displayName: Smoke test
                  inputs:
                    azureSubscription: ${{ parameters.serviceConnection }}
                    scriptType: pscore
                    scriptLocation: inlineScript
                    workingDirectory: $(Build.SourcesDirectory)
                    inlineScript: |
                      Set-StrictMode -Version 3.0
                      $ErrorActionPreference = 'Stop'
                      $env:AZURE_SUBSCRIPTION_ID = '$(azureSubscriptionId)'
                      $env:AZURE_TENANT_ID = '$(azureTenantId)'
                      ./tests/smoke/Invoke-SmokeTest.ps1 `
                        -Environment '${{ parameters.environmentName }}' `
                        -AgentName '${{ parameters.agentName }}' `
                        -ExpectedVersion '${{ parameters.agentVersion }}' `
                        -ReleaseRecordPath '$(releaseRecordPath)' `
                        -ResultPath '$(Build.ArtifactStagingDirectory)/releases/smoke-${{ parameters.environmentName }}.json'

                - ${{ if and(eq(parameters.runEvaluations, true), ne(parameters.evaluationSuitePath, '')) }}:
                    - task: AzureCLI@2
                      displayName: Evaluations
                      inputs:
                        azureSubscription: ${{ parameters.serviceConnection }}
                        scriptType: pscore
                        scriptLocation: inlineScript
                        workingDirectory: $(Build.SourcesDirectory)
                        inlineScript: |
                          Set-StrictMode -Version 3.0
                          $ErrorActionPreference = 'Stop'
                          $env:AZURE_SUBSCRIPTION_ID = '$(azureSubscriptionId)'
                          $env:AZURE_TENANT_ID = '$(azureTenantId)'
                          ./tests/evaluations/Invoke-EvaluationSuite.ps1 `
                            -SuitePath '${{ parameters.evaluationSuitePath }}' `
                            -ReleaseRecordPath '$(releaseRecordPath)' `
                            -Environment '${{ parameters.environmentName }}' `
                            -AgentName '${{ parameters.agentName }}' `
                            -ResultPath '$(Build.ArtifactStagingDirectory)/releases/evaluation-${{ parameters.environmentName }}.json'

                - ${{ if eq(parameters.runRegression, true) }}:
                    - task: AzureCLI@2
                      displayName: Regression tests
                      inputs:
                        azureSubscription: ${{ parameters.serviceConnection }}
                        scriptType: pscore
                        scriptLocation: inlineScript
                        workingDirectory: $(Build.SourcesDirectory)
                        inlineScript: |
                          Set-StrictMode -Version 3.0
                          $ErrorActionPreference = 'Stop'
                          $env:AZURE_SUBSCRIPTION_ID = '$(azureSubscriptionId)'
                          $env:AZURE_TENANT_ID = '$(azureTenantId)'
                          ./tests/regression/Invoke-RegressionTest.ps1 `
                            -ReleaseRecordPath '$(releaseRecordPath)' `
                            -Environment '${{ parameters.environmentName }}' `
                            -AgentName '${{ parameters.agentName }}' `
                            -ResultPath '$(Build.ArtifactStagingDirectory)/releases/regression-${{ parameters.environmentName }}.json'

                - task: AzureCLI@2
                  displayName: Attest release gates
                  condition: and(always(), eq(variables['deploymentCommandSucceeded'], 'true'), eq(variables['mutationCompleted'], 'true'))
                  inputs:
                    azureSubscription: ${{ parameters.serviceConnection }}
                    scriptType: pscore
                    scriptLocation: inlineScript
                    workingDirectory: $(Build.SourcesDirectory)
                    inlineScript: |
                      Set-StrictMode -Version 3.0
                      $ErrorActionPreference = 'Stop'
                      $env:AZURE_SUBSCRIPTION_ID = '$(azureSubscriptionId)'
                      $env:AZURE_TENANT_ID = '$(azureTenantId)'

                      $parameters = @{
                        ReleaseRecordPath = '$(releaseRecordPath)'
                        PackagePath       = '$(packagePath)'
                        SmokeResultPath   = '$(Build.ArtifactStagingDirectory)/releases/smoke-${{ parameters.environmentName }}.json'
                        ReleaseDirectory  = '$(Build.ArtifactStagingDirectory)/releases'
                      }
                      if ('${{ parameters.runEvaluations }}' -ieq 'true' -and '${{ parameters.evaluationSuitePath }}' -ne '') {
                        $parameters['EvaluationResultPath'] = '$(Build.ArtifactStagingDirectory)/releases/evaluation-${{ parameters.environmentName }}.json'
                      }
                      if ('${{ parameters.runRegression }}' -ieq 'true') {
                        $parameters['RegressionResultPath'] = '$(Build.ArtifactStagingDirectory)/releases/regression-${{ parameters.environmentName }}.json'
                      }

                      ./scripts/Complete-Release.ps1 @parameters

                - ${{ if eq(parameters.rollbackOnFailure, true) }}:
                    - task: AzureCLI@2
                      displayName: Roll back on failure
                      condition: and(failed(), eq(variables['deploymentChanged'], 'true'), eq(variables['priorArtifactStaged'], 'true'))
                      inputs:
                        azureSubscription: ${{ parameters.serviceConnection }}
                        scriptType: pscore
                        scriptLocation: inlineScript
                        workingDirectory: $(Build.SourcesDirectory)
                        inlineScript: |
                          Set-StrictMode -Version 3.0
                          $ErrorActionPreference = 'Continue'
                          $env:AZURE_SUBSCRIPTION_ID = '$(azureSubscriptionId)'
                          $env:AZURE_TENANT_ID = '$(azureTenantId)'
                          Write-Host "##vso[task.logissue type=warning]Deployment or post-deployment testing failed in '${{ parameters.environmentName }}'. Attempting rollback."
                          try {
                            $rollbackArtifactPath = '$(rollbackArtifactPath)'
                            if ([string]::IsNullOrWhiteSpace($rollbackArtifactPath)) {
                              throw 'Deployment changed the environment, but no staged prior package was returned for automatic rollback.'
                            }
                            ./scripts/Invoke-Rollback.ps1 `
                              -ReleaseRecordPath '$(releaseRecordPath)' `
                              -EvaluationSuitePath '${{ parameters.evaluationSuitePath }}' `
                              -AgentName '${{ parameters.agentName }}' `
                              -Environment '${{ parameters.environmentName }}' `
                              -ArtifactDirectory (Split-Path -Parent $rollbackArtifactPath) `
                              -ReleaseDirectory '$(Build.ArtifactStagingDirectory)/releases' `
                              -ChangeRecordId '${{ parameters.changeRecordId }}' `
                              -BusinessSignoffId '${{ parameters.businessSignoffId }}' `
                              -Reason 'Automatic rollback: build $(Build.BuildId) failed.' `
                              -Confirm:$false
                          }
                          catch {
                            Write-Host "##vso[task.logissue type=error]Automatic rollback failed: $($_.Exception.Message)"
                            Write-Host "##vso[task.logissue type=error]Follow the manual procedure in docs/deployment-runbook.md."
                            exit 1
                          }

                - task: PowerShell@2
                  displayName: Surface first-deployment recovery
                  condition: and(failed(), eq(variables['deploymentChanged'], 'true'), ne(variables['priorArtifactStaged'], 'true'))
                  inputs:
                    pwsh: true
                    targetType: inline
                    script: |
                      Write-Host "##vso[task.logissue type=error]Runtime activation may have changed '${{ parameters.environmentName }}', but no prior package exists. The failed release evidence is in the published releaseRecords artifact. Deploy a known-good package explicitly with import-agent.ps1 and run all required gates; do not attest the failed release."

                - publish: $(Build.ArtifactStagingDirectory)/releases
                  artifact: releaseRecords-${{ parameters.environmentName }}
                  displayName: Publish release record and test results
                  condition: always()

                - ${{ if eq(parameters.republishPackage, true) }}:
                    - task: PublishPipelineArtifact@1
                      displayName: Republish unchanged package for downstream promotion and rollback
                      condition: succeeded()
                      inputs:
                        targetPath: $(packagePath)
                        artifact: ${{ parameters.packageArtifactName }}
