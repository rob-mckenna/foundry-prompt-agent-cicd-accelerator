# Manual rollback of one environment to the previously promoted package.
#
# Rollback redeploys known-good bytes from a retained artifact. It never rebuilds from older source.
# The target environment keeps its approval check: a rollback is still a change.

name: rollback-$(Date:yyyyMMdd)$(Rev:.r)

trigger: none
pr: none

resources:
  pipelines:
    - pipeline: sourcePipeline
      source: foundry-agents-deploy-test
      trigger: none

pool:
  vmImage: ubuntu-latest

parameters:
  - name: environmentName
    displayName: Environment to roll back
    type: string
    values: [dev, test, uat, prod]
  - name: agentName
    displayName: Logical agent name
    type: string
  - name: toPackageId
    displayName: Package id to roll back to (empty uses previous.packageId from the release record)
    type: string
    default: ''
  - name: reason
    displayName: Reason for the rollback
    type: string
  - name: changeRecordId
    displayName: Approved rollback change reference (required for PROD)
    type: string
    default: ''
  - name: businessSignoffId
    displayName: Business acceptance reference BSO-######## (required for PROD)
    type: string
    default: ''
  - name: evaluationSuitePath
    displayName: Evaluation suite path (required when the target overlay requires evaluation)
    type: string
    default: ''
  - name: releaseRecordPath
    displayName: Exact failed/current release JSON path relative to Pipeline.Workspace
    type: string

variables:
  - template: templates/variables/common.yml
  - name: serviceConnectionName
    value: foundry-agents-${{ parameters.environmentName }}
  - name: variableGroupName
    value: foundry-agents-${{ parameters.environmentName }}

stages:
  - stage: rollback
    lockBehavior: sequential
    displayName: Roll back ${{ parameters.environmentName }}
    variables:
      - group: foundry-agents-${{ parameters.environmentName }}
    jobs:
      - deployment: rollbackAgent
        displayName: Roll back ${{ parameters.agentName }}
        environment: foundry-agents-${{ parameters.environmentName }}
        timeoutInMinutes: 45
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: PowerShell@2
                  displayName: Validate rollback governance inputs
                  inputs:
                    pwsh: true
                    targetType: inline
                    script: |
                      Set-StrictMode -Version 3.0
                      $ErrorActionPreference = 'Stop'
                      if ([string]::IsNullOrWhiteSpace('${{ parameters.reason }}')) {
                        throw 'A non-empty rollback reason is required and is persisted in the release record.'
                      }
                      if ('${{ parameters.environmentName }}' -eq 'prod') {
                        if ('${{ parameters.changeRecordId }}' -notmatch '^[A-Za-z]{2,5}-[0-9]{4,10}$') {
                          throw 'PROD rollback requires an approved changeRecordId such as CHG-0043912.'
                        }
                        if ('${{ parameters.businessSignoffId }}' -notmatch '^BSO-[0-9]{4,10}$') {
                          throw 'PROD rollback requires a durable businessSignoffId such as BSO-0043912.'
                        }
                      }

                - task: UsePythonVersion@0
                  displayName: Use Python 3.11
                  inputs:
                    versionSpec: '3.11'

                - task: PowerShell@2
                  displayName: Install pinned Foundry SDK dependencies
                  inputs:
                    pwsh: true
                    targetType: inline
                    workingDirectory: $(Build.SourcesDirectory)
                    script: |
                      Set-StrictMode -Version 3.0
                      $ErrorActionPreference = 'Stop'
                      python -m pip install --disable-pip-version-check -r scripts/python/requirements.txt

                - download: sourcePipeline
                  artifact: agentPackage
                  displayName: Download retained packages
                - download: sourcePipeline
                  artifact: releaseRecords-${{ parameters.environmentName }}
                  displayName: Download exact release context and known-good evidence

                - task: AzureCLI@2
                  name: executeRollback
                  displayName: Roll back
                  inputs:
                    azureSubscription: foundry-agents-${{ parameters.environmentName }}
                    scriptType: pscore
                    scriptLocation: inlineScript
                    workingDirectory: $(Build.SourcesDirectory)
                    inlineScript: |
                      Set-StrictMode -Version 3.0
                      $ErrorActionPreference = 'Stop'
                      $env:AZURE_SUBSCRIPTION_ID = '$(azureSubscriptionId)'
                      $env:AZURE_TENANT_ID = '$(azureTenantId)'

                      $parameters = @{
                        AgentName         = '${{ parameters.agentName }}'
                        Environment       = '${{ parameters.environmentName }}'
                        ArtifactDirectory = '$(Pipeline.Workspace)'
                        ReleaseDirectory  = '$(Build.ArtifactStagingDirectory)/releases'
                        Reason            = '${{ parameters.reason }}'
                        ChangeRecordId    = '${{ parameters.changeRecordId }}'
                        BusinessSignoffId = '${{ parameters.businessSignoffId }}'
                        ReleaseRecordPath = '$(Pipeline.Workspace)/${{ parameters.releaseRecordPath }}'
                        EvaluationSuitePath = '${{ parameters.evaluationSuitePath }}'
                        Confirm           = $false
                      }
                      if ('${{ parameters.toPackageId }}' -ne '') { $parameters['ToPackageId'] = '${{ parameters.toPackageId }}' }
                      $commandOutput = @(./scripts/Invoke-Rollback.ps1 @parameters)
                      $commandOutput | Write-Output
                      $result = @($commandOutput | Where-Object {
                          $_.PSObject.Properties.Name -contains 'ReleaseRecord'
                        }) | Select-Object -Last 1
                      if (-not $result) {
                        throw 'Rollback completed without returning the deployment result contract.'
                      }
                      Write-Host "##vso[task.setvariable variable=rollbackReleaseRecordPath]$($result.ReleaseRecord)"
                      Write-Host "##vso[task.setvariable variable=rollbackPackagePath]$($result.PackagePath)"
                      Write-Host '##vso[task.setvariable variable=rollbackChanged]true'

                - publish: $(Build.ArtifactStagingDirectory)/releases
                  artifact: rollbackRecords-${{ parameters.environmentName }}-$(Build.BuildId)
                  displayName: Publish rollback record
                  condition: always()
