name: _reusable-deploy

# Deploys or promotes one immutable package to one environment.
#
# Approval control: the caller passes `environment`, which binds this job to a GitHub Environment. Required
# reviewers, wait timers and deployment branch policies configured on that environment gate the job before
# any step runs. There is no approval logic in this workflow, on purpose: the platform enforces it.
#
# Authentication: OIDC only. `permissions: id-token: write` plus azure/login@v2 with client id, tenant id and
# subscription id supplied as environment *variables*, not secrets. No client secret exists.

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment name. Must match the target environment (dev, test, uat, prod).
        type: string
        required: true
      targetEnvironment:
        description: Accelerator environment key used to select config/environments/<key>.json.
        type: string
        required: true
      agentName:
        description: Logical agent name.
        type: string
        required: true
      agentVersion:
        description: Agent version, used by the smoke test to confirm what landed.
        type: string
        required: true
      artifactName:
        description: Artifact holding the immutable package.
        type: string
        default: agent-package
      packageFile:
        description: Package file name inside the artifact.
        type: string
        required: true
      operation:
        description: deploy or promote.
        type: string
        default: deploy
      sourceEnvironment:
        description: Environment the package is promoted from. Empty for a direct deploy.
        type: string
        default: ''
      runEvaluations:
        description: Run the agent evaluation suite after deployment.
        type: boolean
        default: false
      evaluationSuitePath:
        description: Path to the evaluation suite, relative to the repository root.
        type: string
        default: ''
      runRegression:
        description: Run regression tests after deployment.
        type: boolean
        default: false
      validateSecretReferences:
        description: Confirm the deployment identity can read every Key Vault reference before writing.
        type: boolean
        default: false
      changeRecordId:
        description: Approved change reference recorded in production metadata and release governance evidence.
        type: string
        default: ''
      businessSignoffId:
        description: Durable UAT business acceptance reference (BSO- followed by 4-10 digits) required for PROD.
        type: string
        default: ''

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to ${{ inputs.targetEnvironment }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: foundry-${{ inputs.targetEnvironment }}-${{ inputs.agentName }}
      cancel-in-progress: false
    environment:
      name: ${{ inputs.environment }}
    env:
      # Non-secret identifiers. Store them as GitHub Environment variables, not secrets.
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      CHANGE_RECORD_ID: ${{ inputs.changeRecordId }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download immutable package
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifactName }}
          path: artifacts

      - name: Verify package before deployment
        shell: pwsh
        run: |
          Set-StrictMode -Version 3.0
          $ErrorActionPreference = 'Stop'
          ./scripts/Test-AgentPackage.ps1 `
            -PackagePath "./artifacts/${{ inputs.packageFile }}" `
            -Environment ${{ inputs.targetEnvironment }} -SkipGovernance
          # Runtime governance, including the real change reference, is mandatory in import-agent before mutation.

      - name: Sign in to Azure with workload identity federation
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Foundry SDK dependencies
        shell: pwsh
        run: |
          Set-StrictMode -Version 3.0
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check -r scripts/python/requirements.txt

      - name: Deploy package
        id: deploy
        if: inputs.operation == 'deploy'
        shell: pwsh
        run: |
          Set-StrictMode -Version 3.0
          $ErrorActionPreference = 'Stop'
          $evidencePath = './out/deployment-evidence.json'
          $result = $null
          $parameters = @{
            PackagePath            = "./artifacts/${{ inputs.packageFile }}"
            Environment            = '${{ inputs.targetEnvironment }}'
            Operation              = 'deploy'
            ReleaseDirectory       = './out/releases'
            DeploymentEvidencePath = $evidencePath
            GateResult             = @{ validation = 'passed' }
          }
          if ('${{ inputs.changeRecordId }}') { $parameters['ChangeRecordId'] = '${{ inputs.changeRecordId }}' }
          if ('${{ inputs.businessSignoffId }}') { $parameters['BusinessSignoffId'] = '${{ inputs.businessSignoffId }}' }
          if ('${{ inputs.validateSecretReferences }}' -eq 'true') { $parameters['ValidateSecretReferences'] = $true }
          try {
            $commandOutput = @(./scripts/import-agent.ps1 @parameters)
            $commandOutput | Write-Output
            $result = @($commandOutput | Where-Object {
                $_.PSObject.Properties.Name -contains 'ReleaseRecord'
              }) | Select-Object -Last 1
            if (-not $result) {
              throw 'Deployment completed without returning the deployment result contract.'
            }
          }
          finally {
            if (Test-Path -LiteralPath $evidencePath) {
              $evidence = Get-Content -LiteralPath $evidencePath -Raw | ConvertFrom-Json
              "releaseRecordPath=$($evidence.releaseRecordPath)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
              "rollbackArtifactPath=$($evidence.rollbackArtifactPath)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
              "mutationStarted=$(([string]$evidence.mutationStarted).ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
              "mutationCompleted=$(([string]$evidence.mutationCompleted).ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
              "priorArtifactStaged=$(([string]$evidence.priorArtifactStaged).ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
              "failureEvidencePath=$evidencePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            }
          }

      - name: Promote package
        id: promote
        if: inputs.operation == 'promote'
        shell: pwsh
        run: |
          Set-StrictMode -Version 3.0
          $ErrorActionPreference = 'Stop'
          $evidencePath = './out/deployment-evidence.json'
          $result = $null
          $sourceEvidence = Get-Content './artifacts/source-release/deployment-evidence.json' -Raw | ConvertFrom-Json
          if ($sourceEvidence.environment -ne '${{ inputs.sourceEnvironment }}' -or
              $sourceEvidence.agentName -cne '${{ inputs.agentName }}' -or $sourceEvidence.mutationCompleted -ne $true) {
            throw 'The handoff does not identify a completed source deployment.'
          }
          $sourceRecords = @(Get-ChildItem './artifacts/source-release' -Recurse -File -Filter "$($sourceEvidence.releaseId).json")
          if ($sourceRecords.Count -ne 1) { throw 'The exact source attempt record is absent or ambiguous in the handoff.' }
          $sourceReleaseRecordPath = $sourceRecords[0].FullName
          try {
            $commandOutput = @(./scripts/promote-agent.ps1 `
              -AgentName '${{ inputs.agentName }}' `
              -FromEnvironment '${{ inputs.sourceEnvironment }}' `
              -ToEnvironment '${{ inputs.targetEnvironment }}' `
              -PackagePath "./artifacts/${{ inputs.packageFile }}" `
              -SourceReleaseRecordPath $sourceReleaseRecordPath `
              -ReleaseDirectory './out/releases' `
              -DeploymentEvidencePath $evidencePath `
              -ChangeRecordId '${{ inputs.changeRecordId }}' `
              -BusinessSignoffId '${{ inputs.businessSignoffId }}' `
              -GateResult @{ validation = 'passed' })
            $commandOutput | Write-Output
            $result = @($commandOutput | Where-Object {
                $_.PSObject.Properties.Name -contains 'ReleaseRecord'
              }) | Select-Object -Last 1
            if (-not $result) {
              throw 'Promotion completed without returning the deployment result contract.'
            }
          }
          finally {
            if (Test-Path -LiteralPath $evidencePath) {
              $evidence = Get-Content -LiteralPath $evidencePath -Raw | ConvertFrom-Json
              "releaseRecordPath=$($evidence.releaseRecordPath)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
              "rollbackArtifactPath=$($evidence.rollbackArtifactPath)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
              "mutationStarted=$(([string]$evidence.mutationStarted).ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
              "mutationCompleted=$(([string]$evidence.mutationCompleted).ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
              "priorArtifactStaged=$(([string]$evidence.priorArtifactStaged).ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
              "failureEvidencePath=$evidencePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            }
          }

      - name: Smoke test
        shell: pwsh
        run: |
          Set-StrictMode -Version 3.0
          $ErrorActionPreference = 'Stop'
          ./tests/smoke/Invoke-SmokeTest.ps1 `
            -Environment '${{ inputs.targetEnvironment }}' `
            -AgentName '${{ inputs.agentName }}' `
            -ExpectedVersion '${{ inputs.agentVersion }}' `
            -ReleaseRecordPath '${{ steps.deploy.outputs.releaseRecordPath || steps.promote.outputs.releaseRecordPath }}' `
            -ResultPath './out/smoke-${{ inputs.targetEnvironment }}.json'

      - name: Evaluations
        if: inputs.runEvaluations && inputs.evaluationSuitePath != ''
        shell: pwsh
        run: |
          Set-StrictMode -Version 3.0
          $ErrorActionPreference = 'Stop'
          ./tests/evaluations/Invoke-EvaluationSuite.ps1 `
            -SuitePath '${{ inputs.evaluationSuitePath }}' `
            -ReleaseRecordPath '${{ steps.deploy.outputs.releaseRecordPath || steps.promote.outputs.releaseRecordPath }}' `
            -Environment '${{ inputs.targetEnvironment }}' `
            -AgentName '${{ inputs.agentName }}' `
            -ResultPath './out/evaluation-${{ inputs.targetEnvironment }}.json'

      - name: Regression tests
        if: inputs.runRegression
        shell: pwsh
        run: |
          Set-StrictMode -Version 3.0
          $ErrorActionPreference = 'Stop'
          ./tests/regression/Invoke-RegressionTest.ps1 `
            -ReleaseRecordPath '${{ steps.deploy.outputs.releaseRecordPath || steps.promote.outputs.releaseRecordPath }}' `
            -Environment '${{ inputs.targetEnvironment }}' `
            -AgentName '${{ inputs.agentName }}' `
            -ResultPath './out/regression-${{ inputs.targetEnvironment }}.json'

      - name: Attest release gates
        if: always() && (steps.deploy.outcome == 'success' || steps.promote.outcome == 'success')
        shell: pwsh
        run: |
          Set-StrictMode -Version 3.0
          $ErrorActionPreference = 'Stop'
          $releaseRecordPath = if ('${{ steps.deploy.outputs.releaseRecordPath }}') {
            '${{ steps.deploy.outputs.releaseRecordPath }}'
          }
          else {
            '${{ steps.promote.outputs.releaseRecordPath }}'
          }
          if ([string]::IsNullOrWhiteSpace($releaseRecordPath)) {
            throw 'Deployment or promotion completed, but no release record path was captured for Complete-Release.ps1.'
          }

          $parameters = @{
            ReleaseRecordPath = $releaseRecordPath
            PackagePath       = "./artifacts/${{ inputs.packageFile }}"
            SmokeResultPath   = './out/smoke-${{ inputs.targetEnvironment }}.json'
            ReleaseDirectory  = './out/releases'
          }
          if ('${{ inputs.runEvaluations }}' -eq 'true' -and '${{ inputs.evaluationSuitePath }}' -ne '') {
            $parameters['EvaluationResultPath'] = './out/evaluation-${{ inputs.targetEnvironment }}.json'
          }
          if ('${{ inputs.runRegression }}' -eq 'true') {
            $parameters['RegressionResultPath'] = './out/regression-${{ inputs.targetEnvironment }}.json'
          }

          ./scripts/Complete-Release.ps1 @parameters

      - name: Roll back on failure
        if: >-
          failure() &&
          ((steps.deploy.outputs.mutationStarted == 'true' && steps.deploy.outputs.priorArtifactStaged == 'true') ||
           (steps.promote.outputs.mutationStarted == 'true' && steps.promote.outputs.priorArtifactStaged == 'true'))
        shell: pwsh
        run: |
          Set-StrictMode -Version 3.0
          $ErrorActionPreference = 'Continue'
          Write-Host "::warning::Deployment or post-deployment testing failed in '${{ inputs.targetEnvironment }}'. Attempting rollback to the previously promoted package."
          try {
            $rollbackArtifactPath = if ('${{ steps.deploy.outputs.rollbackArtifactPath }}') {
              '${{ steps.deploy.outputs.rollbackArtifactPath }}'
            }
            else {
              '${{ steps.promote.outputs.rollbackArtifactPath }}'
            }
            if ([string]::IsNullOrWhiteSpace($rollbackArtifactPath)) {
              throw 'Deployment changed the environment, but no staged prior package was returned for automatic rollback.'
            }
            ./scripts/Invoke-Rollback.ps1 `
              -ReleaseRecordPath '${{ steps.deploy.outputs.releaseRecordPath || steps.promote.outputs.releaseRecordPath }}' `
              -EvaluationSuitePath '${{ inputs.evaluationSuitePath }}' `
              -AgentName '${{ inputs.agentName }}' `
              -Environment '${{ inputs.targetEnvironment }}' `
              -ArtifactDirectory (Split-Path -Parent $rollbackArtifactPath) `
              -ReleaseDirectory './out/releases' `
              -ChangeRecordId '${{ inputs.changeRecordId }}' `
              -BusinessSignoffId '${{ inputs.businessSignoffId }}' `
              -Reason 'Automatic rollback: run ${{ github.run_id }} failed.' `
              -Confirm:$false
          }
          catch {
            Write-Host "::error::Automatic rollback failed: $($_.Exception.Message)"
            Write-Host "::error::Follow the manual procedure in docs/deployment-runbook.md."
            exit 1
          }

      - name: Surface first-deployment recovery
        if: >-
          failure() &&
          ((steps.deploy.outputs.mutationStarted == 'true' && steps.deploy.outputs.priorArtifactStaged != 'true') ||
           (steps.promote.outputs.mutationStarted == 'true' && steps.promote.outputs.priorArtifactStaged != 'true'))
        shell: pwsh
        run: |
          Write-Host "::error::Runtime activation may have changed '${{ inputs.targetEnvironment }}', but no prior package exists. The failed release evidence is in the uploaded out/ artifact. Deploy a known-good package explicitly with import-agent.ps1 and run all required gates; do not attest the failed release."

      - name: Upload release record and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ inputs.targetEnvironment }}-${{ github.run_id }}
          path: out/
          if-no-files-found: ignore
          retention-days: 365
